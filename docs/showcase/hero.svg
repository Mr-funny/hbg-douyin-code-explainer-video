<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">HBG Douyin Code Explainer Video</title>
  <desc id="desc">A warm editorial banner showing a vertical code-generated video, dialogue audio, Whisper alignment and final QA.</desc>
  <defs>
